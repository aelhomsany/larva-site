# /etc/nginx/sites-available/larva
#
# Static-only server block for the Larva site. No backend, no upstream, no PHP.
#
#   scp deploy/nginx.conf user@host:/tmp/larva.conf
#   sudo install -m 644 /tmp/larva.conf /etc/nginx/sites-available/larva
#   sudo ln -sf /etc/nginx/sites-available/larva /etc/nginx/sites-enabled/larva
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is added for you by:
#   sudo certbot --nginx -d leaveo.net -d www.leaveo.net
#
# NOTE ON HEADERS: nginx does not merge add_header across levels — a location
# block containing even one add_header discards every add_header inherited from
# the server block. So all headers live at server level here, and per-file-type
# cache policy comes from the map below instead of from nested add_header or
# expires directives. Do not "tidy" this by moving Cache-Control into locations.

# sites-enabled is included inside http {}, so a map here is in the right context.
map $sent_http_content_type $larva_cache_control {
    default                    "public, max-age=0, must-revalidate";  # HTML: revalidate always
    ~*^text/css                "public, max-age=604800";              # 7 days
    ~*^(application|text)/javascript  "public, max-age=604800";
    ~*^image/                  "public, max-age=2592000";             # 30 days
    ~*^font/                   "public, max-age=2592000";
}

# The apex block is FIRST and marked default_server on purpose. nginx treats the
# first block on a listen address as the default for any unmatched Host, so if
# the www redirect below were first, a bare-IP request or a health check with no
# Host would be 301'd off the box instead of served.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name leaveo.net;

    root /var/www/larva;
    index index.html;

    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/larva.access.log;
    error_log  /var/log/nginx/larva.error.log warn;

    # ---- compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml application/xml+rss;

    # If nginx was built with ngx_brotli, uncomment for smaller transfers:
    # brotli on;
    # brotli_types text/plain text/css application/javascript image/svg+xml application/xml;

    # ---- headers (all of them, at this level only) ------------------------
    # The site loads nothing from anywhere else and has no forms, so the policy
    # can be this strict. It stays valid only while the pages contain no inline
    # <script>, no <style>, and no style="" attributes — they currently do not.
    add_header Content-Security-Policy
        "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'"
        always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Cache-Control          $larva_cache_control always;
    # Enable only once HTTPS is confirmed working and you are sure. Note the
    # missing includeSubDomains: this block owns the leaveo.net apex, and that
    # directive would force HTTPS-only on every leaveo.net subdomain — the
    # product app at app.leaveo.net included — for a year, decided from here.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- routing ----------------------------------------------------------
    # Serves /capabilities as well as /capabilities.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # ---- hygiene ----------------------------------------------------------
    location ~ /\. { deny all; }   # .git, .env, editor droppings
    location ~ ~$  { deny all; }   # backup files
}

# www redirects to the apex, which is what the canonical tags name. Serving the
# same bytes on both hostnames without a redirect splits the site in search
# results; the canonical tag alone only mitigates that.
server {
    listen 80;
    listen [::]:80;
    server_name www.leaveo.net;
    return 301 https://leaveo.net$request_uri;
}
